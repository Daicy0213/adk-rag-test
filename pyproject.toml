[project]
name = "adk-rag"
version = "0.1.0"
description = "方案 A POC：基于 PostgreSQL FTS 的稀疏倒排索引 RAG（英文 Markdown，无 embedding）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "markdown-it-py>=3.0,<5",
    "python-frontmatter>=1.1,<2",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.9,<3",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
# ADK 适配层只在接 Agent 时需要；检索/评估/测试都不依赖它。
# litellm 是 LiteLlm 的运行时依赖（用 DeepSeek 作为回答模型，与仓库其它示例一致）。
adk = [
    "google-adk==2.12.0",
    "litellm==1.96.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adk_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# src：adk_rag 包；.：knowledge_agent（adk web 的入口目录，不在 src 下）
pythonpath = ["src", "."]
markers = [
    "integration: 需要真实 PostgreSQL 的集成测试（无 PG_DSN 或连不上时自动跳过）",
]
